server.port=8081

# --- CIRCUIT BREAKER ---
resilience4j.circuitbreaker.instances.inventario.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventario.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventario.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventario.permittedNumberOfCallsInHalfOpenState=1
# AGREGAR ESTA LÍNEA: Obliga a esperar al menos 5 llamadas antes de evaluar si abre el circuito
resilience4j.circuitbreaker.instances.inventario.minimumNumberOfCalls=5 

# --- REINTENTOS (RETRIES) ---
r# Reintentos (Retries) - Simplificado para que reintente CUALQUIER error
resilience4j.retry.instances.inventario.maxAttempts=3
resilience4j.retry.instances.inventario.waitDuration=200ms

# Exponer todos los endpoints de actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always