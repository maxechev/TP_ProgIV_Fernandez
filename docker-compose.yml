version: '3.8'
services:
  monolito:
    build: ./monolito
    ports:
      - "8080:8080"
    networks:
      - demo-net

  inventario:
    build: ./inventario
    ports:
      - "8082:8082"
    networks:
      - demo-net

  catalogo:
    build: ./catalogo
    ports:
      - "8081:8081"
    depends_on:
      - inventario
    networks:
      - demo-net

networks:
  demo-net:
    driver: bridge